<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      @font-face {
        font-family: "CCS Belvare";
        src: url("assets/fonts/ccsbelvareregular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Luxurious Script";
        src: url("assets/fonts/LuxuriousScript-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Lato";
        src: url("assets/fonts/Lato-Regular.ttf") format("truetype");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Lato";
        src: url("assets/fonts/Lato-Bold.ttf") format("truetype");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Lato";
        src: url("assets/fonts/Lato-BoldItalic.ttf") format("truetype");
        font-weight: 700;
        font-style: italic;
        font-display: block;
      }

      :root {
        --paper: #fff5e1;
        --wine: #47072c;
        --plum: #700143;
        --olive: #4c5409;
        --harvest: #7c8419;
        --font-headline: "CCS Belvare", serif;
        --font-script: "Luxurious Script", cursive;
        --font-body: "Lato", sans-serif;
      }

      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--wine);
      }
      body {
        font-family: var(--font-body);
      }

      #root {
        position: relative;
        overflow: hidden;
        background: var(--wine);
      }

      /* ---------- ground layers ---------- */
      .ground {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #ground-wine-1 {
        background: var(--wine);
        z-index: 1;
        opacity: 1;
      }
      #ground-paper-1 {
        background: var(--paper);
        z-index: 2;
        clip-path: inset(0 100% 0 0);
      }
      #ground-olive {
        background: var(--olive);
        z-index: 3;
        opacity: 0;
      }
      #ground-harvest {
        background: var(--harvest);
        z-index: 4;
        clip-path: inset(100% 0 0 0);
      }
      #ground-wine-2 {
        background: var(--wine);
        z-index: 5;
        clip-path: inset(0 100% 0 0);
      }
      #ground-paper-2 {
        background: var(--paper);
        z-index: 6;
        opacity: 0;
      }

      /* ---------- scene content layers ---------- */
      .scene-content {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 140px 90px;
        gap: 28px;
        box-sizing: border-box;
        text-align: center;
      }
      #lockup-1 {
        z-index: 10;
      }
      #stat-1 {
        z-index: 11;
        opacity: 0;
      }
      #stat-2 {
        z-index: 12;
        opacity: 0;
      }
      #event-details {
        z-index: 13;
        opacity: 0;
      }
      #closing {
        z-index: 14;
        opacity: 0;
      }

      /* ---------- scene 1+2: hook lockup ---------- */
      .headline-line {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.35em;
        font-family: var(--font-headline);
        font-size: 104px;
        line-height: 1.05;
        letter-spacing: 0.02em;
        color: #fff5e1;
      }
      .word {
        display: inline-flex;
      }
      .letter {
        display: inline-block;
      }

      .reune-wrap {
        width: 100%;
        display: flex;
        justify-content: center;
        opacity: 0;
      }
      .reune-text {
        font-family: var(--font-script);
        font-size: 178px;
        fill: #700143;
        fill-opacity: 0;
        stroke: #700143;
        stroke-width: 3;
        stroke-dasharray: 1400;
        stroke-dashoffset: 1400;
      }

      /* ---------- scene 3 & 4: stat beats ---------- */
      .stat-swap-wrap {
        position: relative;
        width: 100%;
        height: 460px;
        display: flex;
        justify-content: center;
      }
      .stat-pair {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .stat-number {
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 170px;
        color: #fff5e1;
        line-height: 1;
      }
      .stat-label {
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 46px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #fff5e1;
      }
      .stat-sub {
        font-family: var(--font-body);
        font-weight: 700;
        font-style: italic;
        font-size: 32px;
        color: #fff5e1;
      }

      /* ---------- scene 5: event details ---------- */
      .event-date {
        font-family: var(--font-headline);
        font-size: 58px;
        line-height: 1.2;
        letter-spacing: 0.02em;
        color: #fff5e1;
        text-align: center;
      }
      .emph {
        color: inherit;
      }
      .event-venue {
        font-family: var(--font-body);
        font-weight: 400;
        font-size: 34px;
        color: #fff5e1;
        opacity: 0.92;
      }

      /* ---------- scene 6: closing lockup ---------- */
      .closing-logo {
        width: 620px;
        height: auto;
        display: block;
      }
      .closing-dateline {
        font-family: var(--font-body);
        font-weight: 400;
        font-size: 34px;
        color: var(--wine);
      }
      .closing-cta {
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 62px;
        color: var(--plum);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
      style="width: 1080px; height: 1920px"
    >
      <!-- ============ GROUND LAYERS ============ -->
      <div class="ground" id="ground-wine-1"></div>
      <div class="ground" id="ground-paper-1"></div>
      <div class="ground" id="ground-olive"></div>
      <div class="ground" id="ground-harvest"></div>
      <div class="ground" id="ground-wine-2"></div>
      <div class="ground" id="ground-paper-2"></div>

      <!-- ============ SCENE 1+2: hook + script lockup (0s - 5.5s) ============ -->
      <div class="scene-content" id="lockup-1">
        <div class="headline-line" id="headline-el-vino-nos">
          <span class="word">
            <span class="letter">E</span><span class="letter">L</span>
          </span>
          <span class="word" id="emphasis-vino">
            <span class="letter">V</span><span class="letter">I</span
            ><span class="letter">N</span><span class="letter">O</span>
          </span>
          <span class="word">
            <span class="letter">N</span><span class="letter">O</span
            ><span class="letter">S</span>
          </span>
        </div>
        <div class="reune-wrap" id="reune-wrap">
          <svg
            id="reune-svg"
            width="820"
            height="320"
            viewBox="0 0 820 320"
          >
            <text
              id="reune-path"
              class="reune-text"
              x="410"
              y="230"
              text-anchor="middle"
            >Reúne</text>
          </svg>
        </div>
      </div>

      <!-- ============ SCENE 3: +150 Bodegas / +700 Etiquetas (5.5s - 8.0s) ============ -->
      <div class="scene-content" id="stat-1">
        <div class="stat-swap-wrap">
          <div class="stat-pair" id="stat1-pair-a">
            <div class="stat-number">
              <span class="plus">+</span><span id="stat1-num-a">0</span>
            </div>
            <div class="stat-label">Bodegas</div>
          </div>
          <div class="stat-pair" id="stat1-pair-b">
            <div class="stat-number">
              <span class="plus">+</span><span id="stat1-num-b">0</span>
            </div>
            <div class="stat-label">Etiquetas</div>
          </div>
        </div>
      </div>

      <!-- ============ SCENE 4: +2.000 Asistentes / 10° Edición (8.0s - 10.5s) ============ -->
      <div class="scene-content" id="stat-2">
        <div class="stat-swap-wrap">
          <div class="stat-pair" id="stat2-pair-a">
            <div class="stat-number">
              <span class="plus">+</span><span id="stat2-num-a">0</span>
            </div>
            <div class="stat-label" id="stat2-label-a">Asistentes</div>
          </div>
          <div class="stat-pair" id="stat2-pair-b">
            <div class="stat-number">10°</div>
            <div class="stat-label">Edición</div>
            <div class="stat-sub" id="stat2-desde">(desde 2015)</div>
          </div>
        </div>
      </div>

      <!-- ============ SCENE 5: event details (10.5s - 13.0s) ============ -->
      <div class="scene-content" id="event-details">
        <div class="event-date" id="event-date">
          <span class="emph" id="emph-4">4</span> Y
          <span class="emph" id="emph-5">5</span> DE
          <span class="emph" id="emph-sept">SEPTIEMBRE</span> 2026
        </div>
        <div class="event-venue" id="event-venue">
          Iguassu Urban Mall, Puerto Iguazú
        </div>
      </div>

      <!-- ============ SCENE 6: closing lockup + CTA (13.0s - 15.0s) ============ -->
      <div class="scene-content" id="closing">
        <img
          class="closing-logo"
          id="closing-logo"
          src="assets/logo/logo_violeta_horizontal.svg"
          alt="ODA al Vino"
        />
        <div class="closing-dateline" id="closing-dateline">
          4 y 5 de Septiembre 2026 · 10° Edición
        </div>
        <div class="closing-cta" id="closing-cta">Asegurá tu entrada</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      // Spanish/Argentine thousands separator: dot every 3 digits, no decimals.
      function formatMiles(n) {
        n = Math.round(n);
        return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      }

      const tl = gsap.timeline({ paused: true });

      // ============================================================
      // SCENE 1 (0s - 3.0s): hook-line-build — "El vino nos"
      // ============================================================

      // Wave letter-stagger entrance, left-to-right, building from frame 0.
      tl.fromTo(
        "#headline-el-vino-nos .letter",
        { y: 34, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.4, ease: "power4.out", stagger: 0.04 },
        0
      );

      // Emphasis word "VINO" — scale_punch + glow on the beat (0.5s).
      tl.to(
        "#emphasis-vino",
        { scale: 1.16, duration: 0.22, ease: "back.out(2.2)", yoyo: true, repeat: 1 },
        0.5
      );
      tl.to(
        "#emphasis-vino",
        {
          textShadow: "0 0 42px rgba(255,245,225,0.95)",
          duration: 0.25,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 1,
        },
        0.5
      );

      // ============================================================
      // SCENE 2 (3.0s - 5.5s): hero-reune-script — "Reúne"
      // ============================================================

      // Ground flip: paper-cream bar_wipe L->R over the wine ground.
      tl.fromTo(
        "#ground-paper-1",
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.25, ease: "power2.inOut" },
        3.0
      );

      // The script word stays fully hidden (not just undrawn) until the ground
      // is cream, so its plum stroke/fill never sits against the dark wine ground.
      tl.set("#reune-wrap", { opacity: 1 }, 3.0);

      // "EL VINO NOS" recolors from paper-cream ink to plum through the same wipe.
      tl.fromTo(
        "#headline-el-vino-nos",
        { color: "#fff5e1" },
        { color: "#700143", duration: 0.25, ease: "power2.inOut" },
        3.0
      );

      // "Reúne" pen-draw: SVG stroke-dashoffset reveal, then ink fill settles solid.
      tl.fromTo(
        "#reune-path",
        { strokeDashoffset: 1400 },
        { strokeDashoffset: 0, duration: 0.8, ease: "power1.inOut" },
        3.25
      );
      tl.fromTo(
        "#reune-path",
        { fillOpacity: 0 },
        { fillOpacity: 1, duration: 0.25, ease: "power1.out" },
        3.85
      );

      // Pattern-interrupt exit: whole lockup snaps out as olive hard-cuts in.
      tl.to(
        "#lockup-1",
        { scale: 1.08, autoAlpha: 0, duration: 0.12, ease: "power3.in" },
        5.38
      );
      tl.set("#ground-olive", { opacity: 1 }, 5.5);

      // ============================================================
      // SCENE 3 (5.5s - 8.0s): +150 Bodegas / +700 Etiquetas
      // ============================================================

      tl.fromTo(
        "#stat-1",
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: 0.01 },
        5.5
      );

      // "+150" scale_punch entrance + count-up 0 -> 150.
      tl.fromTo(
        "#stat1-pair-a",
        { scale: 0.6, autoAlpha: 0 },
        { scale: 1, autoAlpha: 1, duration: 0.35, ease: "back.out(2.2)" },
        5.5
      );
      const stat1ProxyA = { val: 0 };
      tl.fromTo(
        stat1ProxyA,
        { val: 0 },
        {
          val: 150,
          duration: 0.35,
          ease: "power2.out",
          onUpdate: function () {
            document.getElementById("stat1-num-a").textContent = formatMiles(stat1ProxyA.val);
          },
        },
        5.5
      );

      // pair-b staged off-screen right, ready for the whip-replace.
      tl.set("#stat1-pair-b", { x: 130, autoAlpha: 0 }, 5.5);

      // Midpoint whip-replace: pair-a slides out left, pair-b slides in from right,
      // numeral resets and count-ups 0 -> 700 (same motif, second payload).
      tl.to(
        "#stat1-pair-a",
        { x: -130, autoAlpha: 0, duration: 0.18, ease: "power4.out" },
        6.75
      );
      tl.to(
        "#stat1-pair-b",
        { x: 0, autoAlpha: 1, duration: 0.18, ease: "power4.out" },
        6.75
      );
      const stat1ProxyB = { val: 0 };
      tl.fromTo(
        stat1ProxyB,
        { val: 0 },
        {
          val: 700,
          duration: 0.32,
          ease: "power2.out",
          onUpdate: function () {
            document.getElementById("stat1-num-b").textContent = formatMiles(stat1ProxyB.val);
          },
        },
        6.75
      );

      // Exit: group slides out upward as the harvest ground bar_wipes in from below.
      tl.to(
        "#stat-1",
        { y: -160, autoAlpha: 0, duration: 0.2, ease: "power2.in" },
        7.8
      );

      // ============================================================
      // SCENE 4 (8.0s - 10.5s): +2.000 Asistentes / 10° Edición
      // ============================================================

      // Harvest ground arrives bottom-to-top, continuing scene 3's vertical vector.
      tl.fromTo(
        "#ground-harvest",
        { clipPath: "inset(100% 0% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.2, ease: "power2.inOut" },
        8.0
      );

      tl.fromTo(
        "#stat-2",
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: 0.01 },
        8.0
      );

      // "+2.000 Asistentes" count-up + word_reveal on the label.
      const stat2ProxyA = { val: 0 };
      tl.fromTo(
        stat2ProxyA,
        { val: 0 },
        {
          val: 2000,
          duration: 0.4,
          ease: "power2.out",
          onUpdate: function () {
            document.getElementById("stat2-num-a").textContent = formatMiles(stat2ProxyA.val);
          },
        },
        8.0
      );
      tl.fromTo(
        "#stat2-label-a",
        { y: 24, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" },
        8.05
      );

      // pair-b (10° Edición) staged off-screen right for the swap-wipe.
      tl.set("#stat2-pair-b", { x: 130, autoAlpha: 0 }, 8.0);
      tl.set("#stat2-desde", { opacity: 0 }, 8.0);

      // Swap-wipe at the scene midpoint — same rhythm/axis as scene 3's swap.
      tl.to(
        "#stat2-pair-a",
        { x: -130, autoAlpha: 0, duration: 0.18, ease: "power4.out" },
        9.25
      );
      tl.to(
        "#stat2-pair-b",
        { x: 0, autoAlpha: 1, duration: 0.18, ease: "power4.out" },
        9.25
      );

      // "(desde 2015)" fades in smaller/italic a beat later.
      tl.fromTo(
        "#stat2-desde",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power1.out" },
        9.55
      );

      // Exit: quick hide as the wine ground hard-wipes in for scene 5.
      tl.to(
        "#stat-2",
        { autoAlpha: 0, duration: 0.15, ease: "power2.in" },
        10.35
      );

      // ============================================================
      // SCENE 5 (10.5s - 13.0s): event details
      // ============================================================

      // Wine ground returns via a hard L->R bar_wipe, matching the wipe language.
      tl.fromTo(
        "#ground-wine-2",
        { clipPath: "inset(0% 100% 0% 0%)" },
        { clipPath: "inset(0% 0% 0% 0%)", duration: 0.2, ease: "power2.inOut" },
        10.5
      );

      tl.fromTo(
        "#event-details",
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: 0.01 },
        10.5
      );

      // Date: single clean slide_bottom, no stagger — calmer than the stat beats.
      tl.fromTo(
        "#event-date",
        { y: 60, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power4.out" },
        10.5
      );

      // Venue/city line fades in ~0.15s after the date.
      tl.fromTo(
        "#event-venue",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power1.out" },
        10.65
      );

      // Emphasis words "4"/"5"/"Septiembre" — color_shift-to-harvest pulse on the
      // beat (11.2s); this beat breathes longer than the others.
      tl.to(
        ["#emph-4", "#emph-5", "#emph-sept"],
        { color: "#7c8419", duration: 0.3, ease: "sine.inOut", yoyo: true, repeat: 1 },
        11.2
      );

      // Exit: soft cross-dissolve — group scales/fades out as the ground itself
      // crossfades wine -> paper-cream (the only non-wipe transition in the film).
      tl.to(
        "#event-details",
        { scale: 1.06, autoAlpha: 0, duration: 0.4, ease: "power2.in" },
        12.6
      );
      tl.fromTo(
        "#ground-paper-2",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.in" },
        12.6
      );

      // ============================================================
      // SCENE 6 (13.0s - 15.0s): closing lockup + CTA — the still close
      // ============================================================

      tl.fromTo(
        "#closing",
        { autoAlpha: 0 },
        { autoAlpha: 1, duration: 0.01 },
        13.0
      );

      // Logo scale_grow entrance, centered.
      tl.fromTo(
        "#closing-logo",
        { scale: 0.92, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.5, ease: "power2.out" },
        13.0
      );

      // Date/edition line fades in beneath, ~0.1s after the logo lands.
      tl.fromTo(
        "#closing-dateline",
        { y: 20, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" },
        13.6
      );

      // CTA slide_bottom settle.
      tl.fromTo(
        "#closing-cta",
        { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.3, ease: "power4.out" },
        13.8
      );

      // The one still moment: a single hold_breath cycle, then settle to rest.
      tl.to(
        "#closing",
        { scale: 1.015, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1 },
        14.1
      );

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
